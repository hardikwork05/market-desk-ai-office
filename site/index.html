<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<meta name='description' content='Virtual AI office for a trader: meet the AI team that prepares the morning brief, tracks group ideas, keeps the journal and guards the risk rules.'>
<meta name='theme-color' content='#0A0F15'>
<title>Market Desk AI Office</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap'>
<link rel='stylesheet' href='office.css'>
</head>
<body>
<div class='app' id='app'>
  <header class='top'>
    <div class='brand'>
      <span class='mark' aria-hidden='true'>M</span>
      <div><p class='name' id='brandName'>Market Desk</p><p class='sub'>Virtual AI office</p></div>
    </div>
    <p class='date' id='date'></p>
    <div class='right'>
      <span class='live'><i></i>Live demo, sample data</span>
      <button class='pill' id='okPill' type='button'></button>
      <button class='btn' id='tourBtn' type='button'>Play the tour</button>
    </div>
  </header>
  <section class='stage' id='stage' aria-label='Office floor'>
    <canvas id='scene' aria-hidden='true'></canvas>
    <div class='labels' id='labels'></div>
    <nav class='plan' id='plan' aria-label='Floor plan'></nav>
    <nav class='roster' id='roster' aria-label='Cabins'></nav>
    <p class='flat-note'>The 3D view is not available on this device. Pick a cabin to meet the team.</p>
    <p class='hint' id='hint'>Click a cabin to meet the team. Drag to look around.</p>
    <div class='caption' id='caption' hidden>
      <p id='capText'></p>
      <div class='cap-bar'><i id='capFill'></i></div>
    </div>
  </section>
  <aside class='panel' id='panel' aria-live='polite'></aside>
  <div class='loader' id='loader'>
    <span class='mark' aria-hidden='true'>M</span>
    <p class='name' id='loadName'>Market Desk</p>
    <p class='sub'>Virtual AI office</p>
    <div class='bar'></div>
    <small>Setting up the cabins</small>
  </div>
</div>
<script type='module' src='app.js'></script>
</body>
</html>
